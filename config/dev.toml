log_dir = "./logs"
database_url = "sqlite:./data/albion.db"
database_max_connections = 5
usage_log_max_concurrency = 2
response_cache_max_entries = 0
response_cache_ttl_seconds = 0
registry_url = "https://raw.githubusercontent.com/albionlabs/albion.registry/bb81e5bfab45c9b4d19398edebd1eca502c53267/registry"
private_registry_path = "./data/private-registry.data"
allow_registry_fallback = true
rate_limit_global_rpm = 12000
rate_limit_per_key_rpm = 1200
docs_dir = "./docs/book"
local_db_path = "data/raindex.db"
sync_freshness_threshold_seconds = 300

# Local dev RPC overrides. `${VAR}` placeholders resolve from the environment;
# unset vars are dropped with a warning, so a missing key never breaks dev.
[additional_rpcs]
base = [
  "https://lb.drpc.org/ogrpc?network=base&dkey=${DRPC_API_KEY}",
  "https://base-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}",
  "https://mainnet.base.org",
  "https://base.llamarpc.com",
]
