name: Deploy Preview
on:
  workflow_dispatch:
    inputs:
      deploy_scope:
        description: "Deploy scope"
        required: true
        type: choice
        default: "service"
        options:
          - service
          - system
          - all
      reset_preview_state:
        description: "Forget preview Terraform state before recreating infrastructure"
        required: true
        type: boolean
        default: false
concurrency:
  group: deploy-preview
  cancel-in-progress: false
permissions:
  contents: write
  id-token: write
jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Resolve deploy branch
        run: |
          deploy_branch="${GITHUB_REF_NAME}"
          if ! git ls-remote --exit-code --heads origin "$deploy_branch" >/dev/null; then
            echo "Deploy Preview requires an existing remote branch, got '${GITHUB_REF_NAME}'" >&2
            exit 1
          fi
          git fetch origin "refs/heads/$deploy_branch:refs/remotes/origin/$deploy_branch"
          git checkout -B "$deploy_branch" "origin/$deploy_branch"
          echo "DEPLOY_BRANCH=$deploy_branch" >> "$GITHUB_ENV"
      - name: Configure Git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - uses: nixbuild/nix-quick-install-action@v30
        with:
          nix_conf: |
            accept-flake-config = true
            fallback = true
            keep-env-derivations = true
            keep-outputs = true
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            sandbox = false
      - uses: cachix/cachix-action@v15
        continue-on-error: true
        with:
          name: rainlanguage
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          useDaemon: false
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 8G
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
      - name: Provision preview infrastructure
        if: (inputs.deploy_scope || 'service') == 'all'
        env:
          TF_VAR_do_token: ${{ secrets.DO_TOKEN }}
          RESET_PREVIEW_STATE: ${{ inputs.reset_preview_state }}
        run: |
          if [ -z "$TF_VAR_do_token" ]; then
            echo "DO_TOKEN secret is required for preview infrastructure deploys" >&2
            exit 1
          fi
          export TF_VAR_preview_bootstrap_ssh_public_key="$(ssh-keygen -y -f ~/.ssh/id_ed25519)"
          if [ -z "$TF_VAR_preview_bootstrap_ssh_public_key" ]; then
            echo "Unable to derive preview bootstrap public key from SSH_KEY" >&2
            exit 1
          fi
          nix run .#tfStagingProvision
      - name: Commit encrypted Terraform state
        if: (inputs.deploy_scope || 'service') == 'all'
        run: |
          git add infra/terraform.tfstate.age keys.nix
          if git diff --cached --quiet; then
            echo "No encrypted infra changes to commit"
          else
            git commit -m "chore: update preview terraform state"
            git push origin "HEAD:$DEPLOY_BRANCH"
          fi
      - name: Resolve preview host IP
        run: |
          host_ip=$(nix run .#resolveStagingIp)
          if [[ ! "$host_ip" =~ ^[0-9]{1,3}(\.[0-9]{1,3}){3}$ ]]; then
            echo "Invalid preview host IP resolved: $host_ip" >&2
            exit 1
          fi
          echo "::add-mask::$host_ip"
          echo "HOST_IP=$host_ip" >> "$GITHUB_ENV"
      - name: Bootstrap preview host
        if: (inputs.deploy_scope || 'service') == 'all'
        run: DEPLOY_ENV=staging nix run .#bootstrap
      - name: Trust preview host key
        env:
          PREVIEW_SSH_HOST_KEY: ${{ secrets.PREVIEW_SSH_HOST_KEY }}
        run: |
          # Prefer PREVIEW_SSH_HOST_KEY. ssh-keyscan is a first-bootstrap fallback
          # that trusts the presented host key before writing known_hosts.
          if [ -n "$PREVIEW_SSH_HOST_KEY" ]; then
            echo "$HOST_IP $PREVIEW_SSH_HOST_KEY" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$HOST_IP" > ~/.ssh/known_hosts
          fi
      # Prepare local build artifacts used by deploy-rs.
      - run: ./prep.sh
      - name: Deploy preview service
        if: (inputs.deploy_scope || 'service') == 'service'
        timeout-minutes: 60
        run: nix run .#deployStagingService -- rest-api
      - name: Deploy preview system
        if: (inputs.deploy_scope || 'service') == 'system'
        timeout-minutes: 60
        run: nix run .#deployStagingNixos
      - name: Deploy preview system and service
        if: (inputs.deploy_scope || 'service') == 'all'
        timeout-minutes: 60
        run: nix run .#deployStagingAll
